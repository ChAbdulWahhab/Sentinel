name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            binary_name: sscan
            artifact_name: sscan-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary_name: sscan
            artifact_name: sscan-linux-arm64
          - os: macos-13
            target: darwin-amd64
            binary_name: sscan
            artifact_name: sscan-darwin-amd64
          - os: macos-14
            target: darwin-arm64
            binary_name: sscan
            artifact_name: sscan-darwin-arm64
          - os: windows-latest
            target: windows-amd64
            binary_name: sscan.exe
            artifact_name: sscan-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller sentinelscan.spec

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.binary_name }}
          cp dist/${{ matrix.binary_name }} ./${{ matrix.artifact_name }}
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C dist ${{ matrix.binary_name }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dist/${{ matrix.binary_name }} -Destination ./${{ matrix.artifact_name }}
          Compress-Archive -Path dist/${{ matrix.binary_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            sscan-*.*
            sscan-linux-*
            sscan-darwin-*

  publish-release:
    name: Publish Release & Checksums
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release_assets
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
