[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veylance"
dynamic = ["version"]
description = "Interactive CLI website security self-audit tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abdul Wahhab", email = "chabdulwahhab@gmail.com" }]
keywords = ["security", "audit", "cli", "scanner", "pentest"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.60.0",
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "dnspython>=2.6.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "tldextract>=5.0.0",
    "pyfiglet>=1.0.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "pyinstaller>=6.0"]

[project.scripts]
veyl = "veylance.cli:app"
veylance = "veylance.cli:app"

[tool.hatch.version]
path = "veylance/config.py"

[tool.hatch.build.targets.wheel]
packages = ["veylance"]